<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZeroEngine Phase 3</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 127, 80, 0.35), transparent 30%),
                radial-gradient(circle at top right, rgba(78, 197, 201, 0.26), transparent 32%),
                linear-gradient(180deg, #050913 0%, #0d1524 45%, #101a2a 100%);
            color: #f3f7ff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        #engine-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .hud {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            width: min(30rem, calc(100vw - 3rem));
            padding: 1.25rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 1.25rem;
            background: rgba(8, 13, 24, 0.68);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
            pointer-events: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffcf8d;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0.85rem 0 0.4rem;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 0.98;
        }

        p {
            margin: 0.35rem 0;
            line-height: 1.55;
            color: rgba(243, 247, 255, 0.82);
        }

        #status {
            margin-top: 0.9rem;
            font-weight: 600;
            color: #9ae3df;
        }

        @media (max-width: 720px) {
            .hud {
                top: 1rem;
                left: 1rem;
                width: calc(100vw - 2rem);
            }
        }
    </style>
</head>
<body>
    <canvas id="engine-canvas"></canvas>
    <div class="hud">
        <div class="badge">Phase 3 Imported Mesh</div>
        <h1>ZeroEngine</h1>
        <p>Browser-native game engine prototype.</p>
        <p>The current milestone replaces the procedural cube with a GLB-backed mesh loaded through the engine asset path.</p>
        <p id="status">Loading WebAssembly runtime. Click the scene to capture the mouse when the model appears.</p>
    </div>
    <script type="module">
        const status = document.getElementById("status");
        const assetVersion = "__ZEROENGINE_ASSET_VERSION__";

        try {
            const moduleUrl = new URL(`./pkg/zero_engine_client.js?v=${assetVersion}`, import.meta.url);
            const wasmUrl = new URL(`./pkg/zero_engine_client_bg.wasm?v=${assetVersion}`, import.meta.url);
            const { default: init } = await import(moduleUrl.href);

            await init({ module_or_path: wasmUrl });
        } catch (error) {
            console.error("Failed to start ZeroEngine", error);
            if (status) {
                status.textContent = "Startup failed. See the console for details.";
            }
        }
    </script>
</body>
</html>
