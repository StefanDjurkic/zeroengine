name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (server + shared)
        run: cargo clippy -p zero_engine_shared -p zero_engine_server --all-targets -- -D warnings

      - name: cargo build (server + shared)
        run: cargo build -p zero_engine_shared -p zero_engine_server --release

      - name: cargo test (server + shared)
        run: cargo test -p zero_engine_shared -p zero_engine_server

  wasm:
    name: WASM client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      - name: Build client as wasm
        run: cargo build -p zero_engine_client --target wasm32-unknown-unknown --release

  jspp-pipeline:
    name: JSPP compiler pipeline (verify compiled demos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zeroengine
        uses: actions/checkout@v4

      - name: Checkout jspp
        uses: actions/checkout@v4
        with:
          repository: StefanDjurkic/jspp
          path: _jspp

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ ninja-build

      - name: Build jspp compiler
        working-directory: _jspp
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target jspp --parallel

      - name: Locate jspp binary
        id: locate
        run: |
          if [ -x _jspp/build/jspp ]; then
            echo "bin=$PWD/_jspp/build/jspp" >> "$GITHUB_OUTPUT"
          elif [ -x _jspp/build/jspp-ship ]; then
            echo "bin=$PWD/_jspp/build/jspp-ship" >> "$GITHUB_OUTPUT"
          else
            echo "could not find jspp binary" >&2
            ls -la _jspp/build
            exit 1
          fi

      - name: Verify all compiled demos reproduce bit-for-bit (native)
        run: |
          chmod +x demos/compiled/verify.sh
          demos/compiled/verify.sh "${{ steps.locate.outputs.bin }}"

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Verify all compiled demos reproduce bit-for-bit (wasm via node)
        run: |
          chmod +x demos/compiled/verify_wasm.sh
          demos/compiled/verify_wasm.sh "$PWD/_wasm_out"
