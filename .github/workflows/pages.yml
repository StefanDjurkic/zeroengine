name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build wasm client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout jspp (for prototype interpreter)
        uses: actions/checkout@v4
        with:
          repository: StefanDjurkic/jspp
          path: _jspp
          ref: main

      - name: Install stable Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Build client (wasm-pack, --target web)
        run: wasm-pack build client --release --target web

      - name: Setup emsdk (for compile-pipeline wasm demos)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache-pages

      - name: Compile demos/compiled/*/generated.cpp to wasm
        run: |
          set -e
          for demo_dir in demos/compiled/*/; do
              name="$(basename "$demo_dir")"
              [[ -f "$demo_dir/generated.cpp" ]] || continue
              echo "=== $name (wasm) ==="
              emcc -std=c++20 -O2 \
                  "$demo_dir/generated.cpp" \
                  -o "$demo_dir/demo.mjs" \
                  -sMODULARIZE=1 \
                  -sEXPORT_ES6=1 \
                  -sENVIRONMENT=web,worker \
                  -sINVOKE_RUN=0 \
                  -sEXPORTED_RUNTIME_METHODS=callMain
              ls -la "$demo_dir"
          done

      - name: Stage site
        run: |
          set -e
          mkdir -p _site/pkg _site/prototype
          ASSET_VERSION=$(date -u +%Y%m%d%H%M%S)
          # Landing page (with asset-version cache-buster substituted).
          sed "s|__ZEROENGINE_ASSET_VERSION__|${ASSET_VERSION}|g" client/index.html > _site/index.html
          # JSPP playground. Rewrite the ../../prototype import to ./prototype
          # so it resolves under the deployed site root.
          sed 's|\.\./\.\./prototype/jspp.mjs|./prototype/jspp.mjs|g' client/jspp.html > _site/jspp.html
          cp client/jspp_engine_bridge.mjs _site/
          cp client/node-shims.mjs        _site/
          cp _jspp/prototype/jspp.mjs         _site/prototype/
          cp _jspp/prototype/typechecker.mjs  _site/prototype/
          cp -r client/pkg/*              _site/pkg/
          # Ship the compiled demos so the playground can fetch source/cpp/stdout.
          mkdir -p _site/demos
          cp -r demos/compiled            _site/demos/
          # GitHub Pages sometimes serves .wasm with the wrong MIME type.
          echo "/*.wasm  application/wasm" > _site/_headers
          # Disable Jekyll so files starting with _ are served verbatim.
          touch _site/.nojekyll
          ls -la _site _site/pkg _site/prototype

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
